name: Deploy to Production (CD)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual production deployment'
        required: false
        default: 'Manual release trigger'
  workflow_call:

jobs:
  deploy-production:
    name: Deploy to Production (Agent Runtime)
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency: production
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.13"
          enable-cache: true

      - name: Authenticate to Google Cloud (WIF)
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.CICD_PROJECT_ID || vars.PROD_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          install_components: 'beta'

      - name: Install dependencies
        run: uv sync --locked

      - name: Deploy to Production (Agent Runtime)
        run: |
          echo "Deploying blueprint-agent to Production environment..."
          uvx google-agents-cli deploy \
            --project "${{ vars.PROD_PROJECT_ID }}" \
            --region "${{ vars.REGION || 'us-central1' }}" \
            --service-account="${{ vars.APP_SERVICE_ACCOUNT_PROD }}" \
            --update-env-vars="COMMIT_SHA=${{ github.sha }},LOGS_BUCKET_NAME=${{ vars.LOGS_BUCKET_NAME_PROD }}" \
            --no-confirm-project

      - name: Production Verification Check
        run: |
          echo "Checking production deployment status..."
          uvx google-agents-cli deploy --status \
            --project "${{ vars.PROD_PROJECT_ID }}" \
            --region "${{ vars.REGION || 'us-central1' }}" \
            --no-confirm-project || echo "Deploy status checked."
