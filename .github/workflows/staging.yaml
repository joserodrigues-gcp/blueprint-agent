name: Deploy to Staging (CD)

on:
  push:
    branches:
      - main
    paths:
      - 'blueprint_agent/**'
      - 'tests/**'
      - 'deployment/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'

concurrency:
  group: cd-staging-main
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging (Agent Runtime)
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.13"
          enable-cache: true

      - name: Authenticate to Google Cloud (WIF)
        if: "${{ env.WIF_POOL_ID != '' && env.WIF_PROVIDER_ID != '' }}"
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.CICD_PROJECT_ID || vars.STAGING_PROJECT_ID }}
        env:
          WIF_POOL_ID: ${{ secrets.WIF_POOL_ID }}
          WIF_PROVIDER_ID: ${{ secrets.WIF_PROVIDER_ID }}

      - name: Set up Cloud SDK
        if: "${{ steps.auth.outcome == 'success' }}"
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          install_components: 'beta'

      - name: Install dependencies
        run: uv sync --locked

      - name: Deploy to Staging (Agent Runtime)
        if: "${{ steps.auth.outcome == 'success' }}"
        run: |
          echo "Deploying blueprint-agent to Staging environment..."
          uvx google-agents-cli deploy \
            --project "${{ vars.STAGING_PROJECT_ID }}" \
            --region "${{ vars.REGION || 'us-central1' }}" \
            --service-account="${{ vars.APP_SERVICE_ACCOUNT_STAGING }}" \
            --update-env-vars="COMMIT_SHA=${{ github.sha }},LOGS_BUCKET_NAME=${{ vars.LOGS_BUCKET_NAME_STAGING }}" \
            --no-confirm-project

      - name: Staging Smoke & Health Check
        if: "${{ steps.auth.outcome == 'success' }}"
        run: |
          echo "Verifying deployment status..."
          uvx google-agents-cli deploy --status \
            --project "${{ vars.STAGING_PROJECT_ID }}" \
            --region "${{ vars.REGION || 'us-central1' }}" \
            --no-confirm-project || echo "Deploy status checked."

  trigger-production-deployment:
    name: Trigger Production Deployment
    if: "${{ false }}"
    needs: deploy-staging
    uses: ./.github/workflows/deploy-to-prod.yaml
    permissions:
      contents: 'read'
      id-token: 'write'
    secrets: inherit
