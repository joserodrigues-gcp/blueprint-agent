name: PR Checks (CI)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'blueprint_agent/**'
      - 'tests/**'
      - 'deployment/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'

concurrency:
  group: ci-pr-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-and-unit-tests:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.13"
          enable-cache: true

      - name: Install dependencies (with lint & dev tools)
        run: uv sync --locked --extra lint

      - name: Code Quality - Ruff (Linter & Formatting)
        run: uv run ruff check .

      - name: Code Quality - Codespell (Spelling)
        run: uv run codespell

      - name: Code Quality - Ty (Static Type Analysis)
        run: uv run ty check .

      - name: Run Unit Tests (Pytest)
        run: uv run pytest tests/unit -v

  integration-tests:
    name: Integration Tests (Pytest)
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.13"
          enable-cache: true

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: "${{ env.WIF_POOL_ID != '' && env.WIF_PROVIDER_ID != '' }}"
        id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ secrets.WIF_POOL_ID }}/providers/${{ secrets.WIF_PROVIDER_ID }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'
          create_credentials_file: true
          project_id: ${{ vars.CICD_PROJECT_ID || vars.STAGING_PROJECT_ID }}
        env:
          WIF_POOL_ID: ${{ secrets.WIF_POOL_ID }}
          WIF_PROVIDER_ID: ${{ secrets.WIF_PROVIDER_ID }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Integration Tests (Pytest)
        env:
          INTEGRATION_TEST: "TRUE"
          GOOGLE_CLOUD_PROJECT: ${{ vars.STAGING_PROJECT_ID || vars.CICD_PROJECT_ID || 'tim-platform-lab' }}
          GOOGLE_CLOUD_LOCATION: "global"
          GOOGLE_GENAI_USE_ENTERPRISE: "true"
          MODEL: "gemini-3.5-flash-lite"
        run: |
          echo "Executing integration test suite..."
          uv run pytest tests/integration -v

  container-build-check:
    name: Container Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: blueprint-agent:pr-test
          build-args: |
            AGENT_VERSION=0.1.0-pr
