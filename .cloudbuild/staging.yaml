steps:
  # 1. Install uv package manager and sync dependencies
  - name: "gcr.io/cloud-builders/gcloud"
    id: install-dependencies
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        curl -LsSf https://astral.sh/uv/0.8.13/install.sh | sh
        export PATH="$$HOME/.local/bin:$$PATH"
        uv sync --locked

  # 2. Deploy to Staging Agent Runtime
  - name: "gcr.io/cloud-builders/gcloud"
    id: deploy-staging
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        export PATH="$$HOME/.local/bin:$$PATH"
        rm -rf .venv
        echo "Deploying blueprint-agent to Staging Agent Runtime..."
        uvx google-agents-cli deploy \
          --project ${_STAGING_PROJECT_ID} \
          --region ${_REGION} \
          --service-account=${_APP_SERVICE_ACCOUNT_STAGING} \
          --update-env-vars="COMMIT_SHA=${_COMMIT_SHA},LOGS_BUCKET_NAME=${_LOGS_BUCKET_NAME_STAGING}" \
          --no-confirm-project

  # 3. Verify staging deployment
  - name: "gcr.io/cloud-builders/gcloud"
    id: verify-staging
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        export PATH="$$HOME/.local/bin:$$PATH"
        uvx google-agents-cli deploy --status \
          --project ${_STAGING_PROJECT_ID} \
          --region ${_REGION} \
          --no-confirm-project || echo "Deploy status checked."

  # 4. Trigger Production Deployment Trigger (requires manual approval in Console)
  - name: "gcr.io/cloud-builders/gcloud"
    id: trigger-prod-deployment
    entrypoint: gcloud
    args:
      - "beta"
      - "builds"
      - "triggers"
      - "run"
      - "deploy-${_PROJECT_NAME}"
      - "--region"
      - "$LOCATION"
      - "--project"
      - "$PROJECT_ID"
      - "--sha"
      - "$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/gcloud"
    id: echo-approval-instructions
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        echo "========================================================================="
        echo "Staging deployment complete. Production deployment triggered."
        echo "Review and approve production deployment in Cloud Build Console:"
        echo "https://console.cloud.google.com/cloud-build/builds;region=$LOCATION"
        echo "========================================================================="

substitutions:
  _COMMIT_SHA: "manual-staging-deploy"
  _PROJECT_NAME: blueprint-agent
  _STAGING_PROJECT_ID: svc-project-gke02
  _REGION: us-central1
  _APP_SERVICE_ACCOUNT_STAGING: blueprint-agent-app@svc-project-gke02.iam.gserviceaccount.com
  _LOGS_BUCKET_NAME_STAGING: svc-project-gke02-blueprint-agent-logs

logsBucket: gs://${PROJECT_ID}-blueprint-agent-logs/build-logs
options:
  env:
    - 'UV_PYTHON=3.12'
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
