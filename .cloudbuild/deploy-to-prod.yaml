steps:
  # 1. Install uv package manager and sync dependencies
  - name: "gcr.io/cloud-builders/gcloud"
    id: install-dependencies
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        curl -LsSf https://astral.sh/uv/0.8.13/install.sh | sh
        export PATH="$$HOME/.local/bin:$$PATH"
        uv sync --locked

  # 2. Deploy to Production Agent Runtime
  - name: "gcr.io/cloud-builders/gcloud"
    id: deploy-production
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        export PATH="$$HOME/.local/bin:$$PATH"
        rm -rf .venv
        echo "Deploying blueprint-agent to Production Agent Runtime..."
        uvx google-agents-cli deploy \
          --project ${_PROD_PROJECT_ID} \
          --region ${_REGION} \
          --service-account=${_APP_SERVICE_ACCOUNT_PROD} \
          --update-env-vars="COMMIT_SHA=${_COMMIT_SHA},LOGS_BUCKET_NAME=${_LOGS_BUCKET_NAME_PROD}" \
          --no-confirm-project

  # 3. Verify production deployment
  - name: "gcr.io/cloud-builders/gcloud"
    id: verify-production
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        export PATH="$$HOME/.local/bin:$$PATH"
        uvx google-agents-cli deploy --status \
          --project ${_PROD_PROJECT_ID} \
          --region ${_REGION} \
          --no-confirm-project || echo "Production deploy status checked."

substitutions:
  _COMMIT_SHA: "manual-prod-deploy"
  _PROJECT_NAME: blueprint-agent
  _PROD_PROJECT_ID: svc-project-gke02
  _REGION: us-central1
  _APP_SERVICE_ACCOUNT_PROD: blueprint-agent-app@svc-project-gke02.iam.gserviceaccount.com
  _LOGS_BUCKET_NAME_PROD: svc-project-gke02-blueprint-agent-logs

logsBucket: gs://${PROJECT_ID}-blueprint-agent-logs/build-logs
options:
  env:
    - 'UV_PYTHON=3.12'
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
