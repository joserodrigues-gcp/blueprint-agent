steps:
  # 1. Install uv package manager and sync dependencies
  - name: "gcr.io/cloud-builders/gcloud"
    id: install-dependencies
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        curl -LsSf https://astral.sh/uv/0.8.13/install.sh | sh
        export PATH="$$HOME/.local/bin:$$PATH"
        uv sync --locked --extra lint

  # 2. Run code quality and linting checks
  - name: "gcr.io/cloud-builders/gcloud"
    id: lint-checks
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        export PATH="$$HOME/.local/bin:$$PATH"
        echo "Running Ruff checks..."
        uv run ruff check .
        echo "Running Codespell checks..."
        uv run codespell
        echo "Running Ty type checks..."
        uv run ty check .

  # 3. Run unit tests using pytest
  - name: "gcr.io/cloud-builders/gcloud"
    id: unit-tests
    entrypoint: /bin/bash
    args:
      - "-c"
      - |
        export PATH="$$HOME/.local/bin:$$PATH"
        echo "Running pytest unit tests..."
        uv run pytest tests/unit -v

  # 4. Run integration tests using pytest
  - name: "gcr.io/cloud-builders/gcloud"
    id: integration-tests
    entrypoint: /bin/bash
    env:
      - "INTEGRATION_TEST=TRUE"
      - "GOOGLE_CLOUD_PROJECT=$PROJECT_ID"
      - "GOOGLE_CLOUD_LOCATION=global"
      - "GOOGLE_GENAI_USE_ENTERPRISE=true"
      - "MODEL=gemini-3.5-flash-lite"
    args:
      - "-c"
      - |
        export PATH="$$HOME/.local/bin:$$PATH"
        echo "Running pytest integration tests..."
        uv run pytest tests/integration -v

  # 5. Verify container build
  - name: "gcr.io/cloud-builders/docker"
    id: container-build-check
    args:
      - "build"
      - "-t"
      - "blueprint-agent:pr-check"
      - "."

logsBucket: gs://${PROJECT_ID}-blueprint-agent-logs/build-logs
options:
  env:
    - 'UV_PYTHON=3.12'
  substitutionOption: ALLOW_LOOSE
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
